# .deb and .rpm from the staged tree in dist/linux/root (see build.sh).
# Paths are relative to desktop/, where build.sh runs nfpm.
# ${VERSION} and ${NFPM_ARCH} are filled in from the environment.
name: mistcoat
version: ${VERSION}
arch: ${NFPM_ARCH}
platform: linux
section: graphics
priority: optional
maintainer: Mistcoat <mistcoat@users.noreply.github.com>
description: |
  Protect artwork from AI training and style mimicry.
  Mistcoat makes small, mostly invisible changes to an image that degrade its
  value as AI training data, and embeds the standard "do not train" metadata.
  Everything runs locally; no image is uploaded.
vendor: Mistcoat
homepage: https://mistcoat.app
license: Proprietary

contents:
  - src: dist/linux/root/opt/mistcoat
    dst: /opt/mistcoat
    type: tree
  - src: /opt/mistcoat/Mistcoat
    dst: /usr/bin/mistcoat
    type: symlink
  - src: dist/linux/root/usr/share
    dst: /usr/share
    type: tree

# Everything else is bundled (see build.sh step 1). These are only the base
# libraries every Linux desktop already has; listing them lets apt/dnf add
# any that are missing automatically, during the same install.
overrides:
  deb:
    depends:
      - libegl1
      - libgl1
      - libfontconfig1
      - libdbus-1-3
      - libglib2.0-0 | libglib2.0-0t64
      - libx11-xcb1
      - libxcb1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
  rpm:
    # By shared-library name, so the same .rpm resolves on Fedora, RHEL,
    # openSUSE and friends, whose package names differ.
    depends:
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libfontconfig.so.1()(64bit)
      - libdbus-1.so.3()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)

scripts:
  postinstall: packaging/linux/postinstall.sh
  postremove: packaging/linux/postinstall.sh
