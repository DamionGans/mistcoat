name: Desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Qt's system libraries (the GUI tests import PySide6)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest   # Intel / AMD
            arch: x64
          - runner: windows-11-arm   # Snapdragon and other ARM PCs, built natively
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
      - name: Build and self-test
        shell: pwsh
        run: |
          python -m venv .venv
          ./packaging/windows/build.ps1
          $arch = & .\.venv\Scripts\python.exe -c "import platform; print(platform.machine())"
          Write-Host "Built for $arch"
          Rename-Item dist\Mistcoat.exe "Mistcoat-$((& .\.venv\Scripts\python.exe -c 'import mistcoat; print(mistcoat.__version__)'))-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: Mistcoat-windows-${{ matrix.arch }}
          path: desktop/dist/Mistcoat-*-windows-*.exe

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build, sign and self-test
        env:
          PYTHON: python
          # Optional - set these repository secrets to ship a notarised build.
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
        run: ./packaging/macos/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Mistcoat-macos-${{ matrix.arch }}
          path: desktop/dist/*.dmg

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 is the oldest supported base: the build runs on any distro
          # with glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+).
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tools and Qt's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak dbus-daemon \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-image0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          sudo snap install snapcraft --classic
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Ubuntu 22.04's flatpak-builder is too old for the 25.08 runtime.
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build .deb, .rpm, AppImage and Flatpak
        env:
          PYTHON: python
          FLATPAK_BUILDER: flatpak run org.flatpak.Builder
        # The sandboxed builder talks to the host's flatpak over D-Bus, which a
        # headless runner has no session for.
        run: dbus-run-session -- ./packaging/linux/build.sh
      # Install each package the way a user would and run its self-test.
      # Each test starts from a clean container, so nothing installed on the
      # build machine can hide a missing dependency. QT_QPA_PLATFORM=xcb under
      # Xvfb loads the real X11 display plugin rather than the headless one.
      - name: Test the .deb (clean Ubuntu 22.04, real X display)
        run: |
          docker run --rm -v "$PWD/dist:/d" ubuntu:22.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /d/mistcoat_*.deb xvfb xauth > /dev/null
            test -f /usr/share/applications/app.mistcoat.Mistcoat.desktop
            QT_QPA_PLATFORM=xcb xvfb-run -a mistcoat --selftest /tmp/r.json
            cat /tmp/r.json; grep -q "\"qt_platform\": \"xcb\"" /tmp/r.json
            grep -q "\"ok\": true" /tmp/r.json'
      - name: Test the AppImage (bare Debian 12, only base desktop libraries)
        run: |
          docker run --rm -v "$PWD/dist:/d" debian:12 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # What any desktop has - deliberately none of the xcb helper libs.
            apt-get install -y -qq --no-install-recommends libgl1 libegl1 \
              libfontconfig1 libdbus-1-3 libglib2.0-0 libx11-xcb1 libxcb1 \
              xvfb xauth > /dev/null
            cd /tmp && /d/Mistcoat-*-linux-*.AppImage --appimage-extract > /dev/null
            QT_QPA_PLATFORM=xcb xvfb-run -a squashfs-root/AppRun --selftest /tmp/r.json
            cat /tmp/r.json; grep -q "\"qt_platform\": \"xcb\"" /tmp/r.json
            grep -q "\"ok\": true" /tmp/r.json'
      - name: Test the Snap (strict confinement, real X display)
        run: |
          sudo snap install --dangerous ./dist/mistcoat_*.snap
          sudo apt-get install -y -qq xvfb xauth > /dev/null
          # Headless, then with the real X11 plugin through the snap's x11 plug.
          snap run mistcoat --selftest "$HOME/snap-selftest.json"
          cat "$HOME/snap-selftest.json"; grep -q '"ok": true' "$HOME/snap-selftest.json"
          QT_QPA_PLATFORM=xcb xvfb-run -a snap run mistcoat --selftest "$HOME/snap-xcb.json"
          cat "$HOME/snap-xcb.json"
          grep -q '"qt_platform": "xcb"' "$HOME/snap-xcb.json"
          grep -q '"ok": true' "$HOME/snap-xcb.json"
      - name: Test the .rpm (Fedora and openSUSE)
        run: |
          docker run --rm -v "$PWD/dist:/d" fedora:43 sh -c \
            'dnf install -y /d/mistcoat-*.rpm && mistcoat --selftest /tmp/r.json && cat /tmp/r.json && grep -q "\"ok\": true" /tmp/r.json'
          docker run --rm -v "$PWD/dist:/d" opensuse/tumbleweed sh -c \
            'zypper --non-interactive install --allow-unsigned-rpm /d/mistcoat-*.rpm && mistcoat --selftest /tmp/r.json && cat /tmp/r.json && grep -q "\"ok\": true" /tmp/r.json'
      - name: Test the Flatpak
        run: |
          flatpak install --user -y --noninteractive dist/Mistcoat-*.flatpak
          dbus-run-session -- flatpak run --command=mistcoat app.mistcoat.Mistcoat \
            --selftest "$HOME/flatpak-selftest.json"
          cat "$HOME/flatpak-selftest.json"
          grep '"ok": true' "$HOME/flatpak-selftest.json"
      - uses: actions/upload-artifact@v7
        with:
          name: Mistcoat-linux-${{ matrix.arch }}
          path: |
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.AppImage
            desktop/dist/*.flatpak
            desktop/dist/*.snap
