name: Desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Qt's system libraries (the GUI tests import PySide6)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and self-test
        shell: pwsh
        run: |
          python -m venv .venv
          ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: Mistcoat-windows-x64
          path: dist/Mistcoat.exe

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build, sign and self-test
        env:
          PYTHON: python
          # Optional - set these repository secrets to ship a notarised build.
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
        run: ./packaging/build_mac.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Mistcoat-macos-${{ matrix.arch }}
          path: dist/*.dmg

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 is the oldest supported base: the build runs on any distro
          # with glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+).
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tools and Qt's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak dbus-daemon \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-image0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Ubuntu 22.04's flatpak-builder is too old for the 25.08 runtime.
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build .deb, .rpm, AppImage and Flatpak
        env:
          PYTHON: python
          FLATPAK_BUILDER: flatpak run org.flatpak.Builder
        # The sandboxed builder talks to the host's flatpak over D-Bus, which a
        # headless runner has no session for.
        run: dbus-run-session -- ./packaging/linux/build_linux.sh
      # Install each package the way a user would and run its self-test.
      - name: Test the .deb (Ubuntu)
        run: |
          sudo apt-get install -y ./dist/mistcoat_*.deb
          test -f /usr/share/applications/app.mistcoat.Mistcoat.desktop
          mistcoat --selftest "$RUNNER_TEMP/deb.json"
          grep '"ok": true' "$RUNNER_TEMP/deb.json"
      - name: Test the .rpm (Fedora and openSUSE)
        run: |
          docker run --rm -v "$PWD/dist:/d" fedora:43 sh -c \
            'dnf install -y /d/mistcoat-*.rpm && mistcoat --selftest /tmp/r.json && cat /tmp/r.json && grep -q "\"ok\": true" /tmp/r.json'
          docker run --rm -v "$PWD/dist:/d" opensuse/tumbleweed sh -c \
            'zypper --non-interactive install --allow-unsigned-rpm /d/mistcoat-*.rpm && mistcoat --selftest /tmp/r.json && cat /tmp/r.json && grep -q "\"ok\": true" /tmp/r.json'
      - name: Test the Flatpak
        run: |
          flatpak install --user -y --noninteractive dist/Mistcoat-*.flatpak
          dbus-run-session -- flatpak run --command=mistcoat app.mistcoat.Mistcoat \
            --selftest "$HOME/flatpak-selftest.json"
          cat "$HOME/flatpak-selftest.json"
          grep '"ok": true' "$HOME/flatpak-selftest.json"
      - uses: actions/upload-artifact@v5
        with:
          name: Mistcoat-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.flatpak
