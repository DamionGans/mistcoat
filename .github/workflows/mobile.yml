name: Mobile builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: Mistcoat-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the iOS simulator (no signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        with:
          name: Mistcoat-ios-simulator
          path: mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
      # An unsigned device build packed as an .ipa. It cannot be installed as
      # is: a sideloading tool (Sideloadly, AltStore) signs it with the user's
      # own Apple ID on the way onto the phone. See docs/RELEASING.md.
      - name: Build unsigned IPA for devices
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          VERSION=$(node -p "require('../../package.json').version")
          APP=build-device/Build/Products/Release-iphoneos/App.app
          test -x "$APP/App"
          lipo -info "$APP/App"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "Mistcoat-${VERSION}-ios-unsigned.ipa" Payload)
          ls -la ipa/*.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: Mistcoat-ios-unsigned-ipa
          path: mobile/ios/App/ipa/*.ipa
